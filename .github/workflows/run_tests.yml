name: Run Tests
run-name: >-
  Run Tests: ${{
    github.event_name == 'pull_request' && github.event.pull_request.title ||
    github.event.head_commit.message ||
    format('Triggered by {0}', github.actor)
  }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            libgtk-3-dev

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DCMAKE_CXX_FLAGS="-Wno-stringop-overflow"

      - name: Build Test Harnesses and Emulator
        run: |
          cmake \
            --build build \
            --parallel \
            --target game-boy-tests

      - name: Run Tests
        run: |
          ./build/bin/game-boy-tests \
            --gtest_output=xml:build/gtest-results.xml

      - if: always()
        name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/gtest-results.xml
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          job_summary: true
          annotate_only: true
          skip_annotations: true
          resolve_ignore_classname: true
